# Brochure edition metadata. Read by tools/build.py.
#
# version              Brochure edition, as MAJOR.MINOR[.PATCH].
#                        MAJOR  the law changed; pages 2-4 re-researched and
#                               legislative_snapshot moves with it
#                        MINOR  wording of the content changed -- corrections
#                               or rewrites that leave the legal position as
#                               it was
#                        PATCH  anything else reaching the printed page: build
#                               system, template, typography, artwork.
#                               OPTIONAL -- omit it until there is a patch
#                               revision to record. "1.0" is valid; you do
#                               not need to write "1.0.0".
#                      The published filename carries the snapshot date and
#                      PATCH only, so a MINOR bump alone does not change the
#                      filename and the new PDF overwrites the old. See the
#                      filename caveat in README.md.
# legislative_snapshot The date against which the legal and policy content on
#                      pages 2-4 was researched and verified. Set this BY HAND,
#                      and only after re-checking the claims against
#                      references/sources.md. It is deliberately not derived
#                      from the build date: a rebuild is not a fact-check.
#                      YYYY-MM-DD, or YYYY-MM when only the month is meaningful.
# snapshot_warn_months How stale the snapshot may get before the build warns.
# site_url             The project's public address. Single source of truth: it
#                      is printed on the back cover, written into page 15, and
#                      encoded in the QR. The build refuses to proceed if the
#                      committed QR encodes a different address.

version = 1.0.3
legislative_snapshot = 2026-09-17
snapshot_warn_months = 1
site_url = https://snarkypuss.ca
